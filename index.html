:root{--bg:#faf8f4;--fg:#222;--card:#fff;--mut:#777;--ac:#b4472b;--bd:#ddd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b19;--fg:#eee;--card:#2a2825;--mut:#999;--ac:#e8845f;--bd:#444}}
:root[data-theme="dark"]{--bg:#1c1b19;--fg:#eee;--card:#2a2825;--mut:#999;--ac:#e8845f;--bd:#444}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 Georgia,serif}
.w{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:.2em 0}p.s{color:var(--mut);margin:0 0 12px;font-family:system-ui,sans-serif;font-size:.9rem}
button{font:inherit;font-family:system-ui,sans-serif;font-size:.9rem;padding:8px 14px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px;cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.grid label{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:8px 4px;text-align:center;cursor:pointer;font-family:system-ui,sans-serif;font-size:.85rem;user-select:none}
.grid label.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid input{display:none}.grid small{display:block;opacity:.7;font-size:.7rem}
.card{margin:16px 0;min-height:240px;background:var(--card);border:1px solid var(--bd);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;cursor:pointer;box-shadow:0 2px 8px #0001}
.big{font-size:2.2rem;font-weight:bold;word-break:break-word}.tag{font-family:system-ui,sans-serif;font-size:.75rem;color:var(--mut);margin-top:14px}
.hint{color:var(--mut);font-family:system-ui,sans-serif;font-size:.85rem}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.hide{display:none}
.prog{height:6px;background:var(--bd);border-radius:3px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ac)}
.card{min-height:320px;user-select:none}.mean{font-size:1.4rem;margin:6px 0 14px}.lbl{font-family:system-ui,sans-serif;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ac);margin-top:12px}.det{max-width:520px}.ex{font-style:italic}


:root[data-theme="light"]{--bg:#faf8f4;--fg:#222;--card:#fff;--mut:#777;--ac:#b4472b;--bd:#ddd}
html{font-size:calc(16px*var(--fs,1))}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tools{display:flex;gap:6px}.tools button{padding:4px 10px}
.ch{margin:14px 0 6px;display:flex;align-items:center;gap:8px;font-family:system-ui,sans-serif;font-size:.85rem;font-weight:600}

for(const q of pts){const depth=Math.min(1,Math.max(0,(R-q.z)/(2*R)));sx2.globalAlpha=(.04+.2*depth)*q.f*(.1+.9*Math.min(1,Math.abs(q.x-cx)/(sW*.4)));sx2.fillStyle=q.k?col:fg;sx2.font=`${Math.round(10*q.s*1.5)}px Georgia,serif`;sx2.fillText(q.w,q.x,q.y)}
sx2.globalAlpha=1}
function sLoop(now){sDraw(now);raf=requestAnimationFrame(sLoop)}
sRes();sCol();addEventListener('resize',()=>{sRes();if(RM)sDraw(performance.now())});
if(RM)sDraw(performance.now()+20000);else raf=requestAnimationFrame(sLoop);
const DEF=10,MS=[3,7,14,30,100],FLs='<svg class="fl" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12c2-2.96 0-7-1-8 0 3.038-1.773 4.741-3 6-1.226 1.26-2 3.24-2 5a6 6 0 1 0 12 0c0-1.532-1.056-3.94-2-5-1.786 3-2.791 3-4 2z"/></svg>';
const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function sload(){try{const s=JSON.parse(localStorage.getItem('rw_streak')||'null');if(s&&s.days){s.goals=s.goals||{};return s}}catch(e){}return{days:{},goals:{},best:0}}
function ssave(s){try{localStorage.setItem('rw_streak',JSON.stringify(s))}catch(e){}}
function gk(s,key){return s.goals[key]||(key==dk(new Date())?(s.goal||DEF):DEF)}
function ok(s,key){return(s.days[key]||0)>=gk(s,key)}
function scalc(s){const t=new Date();let cur=new Date(t),n=0;const td=ok(s,dk(t));if(!td)cur.setDate(cur.getDate()-1);
while(ok(s,dk(cur))){n++;cur.setDate(cur.getDate()-1)}return{n,td}}
let geOpen=false;
function editGoal(){geOpen=!geOpen;renderStreak()}
function setGoal(v){v=Math.max(5,Math.min(200,Math.round(+v||DEF)));const s=sload();s.goal=v;s.goals[dk(new Date())]=v;ssave(s);renderStreak()}
function renderStreak(){const s=sload(),{n}=scalc(s),t=new Date(),key0=dk(t),cnt=s.days[key0]||0,goal=gk(s,key0),best=Math.max(s.best||0,n);
$('sn').textContent=n;
const mon=new Date(t);mon.setDate(t.getDate()-((t.getDay()+6)%7));const names=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];let wk='';
for(let k=0;k<7;k++){const d=new Date(mon);d.setDate(mon.getDate()+k);const key=dk(d),done=ok(s,key),today=key==key0,fut=d>t&&!today;
wk+=`<div class="${done?'d':today?'t':fut?'f':'m'}"><i>${done?'✓':''}</i><span>${today?'Today':names[k]}</span></div>`}
$('stk').innerHTML=`<div class="r1"><div class="big2">${FLs}${n} day streak</div><div class="best">Best ${best}</div></div><div class="wk">${wk}</div><div class="gl"><span>Today's goal <button class="ed" onclick="editGoal()">${geOpen?'Done':'Edit'}</button></span><em>${Math.min(cnt,goal)} of ${goal} cards</em></div>${geOpen?`<div class="ge"><button onclick="setGoal(${goal}-5)" aria-label="Decrease goal">−</button><input type="number" inputmode="numeric" min="5" max="200" value="${goal}" onchange="setGoal(this.value)" aria-label="Cards per day"><button onclick="setGoal(${goal}+5)" aria-label="Increase goal">+</button><span>cards a day</span></div>`:''}<div class="gb"><i style="width:${Math.min(100,cnt/goal*100)}%"></i></div>`}
let tt;function toast(m){const e=$('toast');e.innerHTML=FLs+'<span>'+m+'</span>';e.classList.remove('hide','fade');clearTimeout(tt);tt=setTimeout(()=>{e.classList.add('fade');setTimeout(()=>e.classList.add('hide'),320)},3200)}
function bump(){const s=sload(),k=dk(new Date()),g=gk(s,k);s.goals[k]=g;s.days[k]=(s.days[k]||0)+1;const {n}=scalc(s);s.best=Math.max(s.best||0,n);ssave(s);renderStreak();
if(s.days[k]==g)toast(MS.includes(n)?n+' day streak. Nice work.':'Daily goal reached. '+n+' day streak.')}
apply();cnt();renderStreak();
